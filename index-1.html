<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="description" content="this is a low-bandwidth weather webapp">

	<title>low-bandwidth weather</title>
	<script>
		'use strict';
		class Test {
			constructor() {
				this.testResults = document.getElementsByClassName('test-results');
			}

			// current weather API call function
			async run() {
				try {
					const apiKey = '8fd67a091981a015cfbb030cfecdccd0';
					const city = document.querySelector('input[name="cityState"]').value + ', USA';

					//	const lat = latitude;
					//	const lon = longitude;

					// call current weather report API
					const response = await axios.get(
						'https://api.openweathermap.org/data/2.5/weather',
						{
							params: {
								q: city,
								// lat: lat,
								// lon: lon,
								appid: apiKey,
								units: 'imperial'
							}
						}
					);
					const data = response.data;
					this.setResults({
						city: data.name,
						country: data.sys.country,
						temp: data.main.temp + '°F',
						description: data.weather[0].description,
						humidity: data.main.humidity + '%',
						//rain: data.rain[0] + 'mm in past hour',
						windSpeed: data.wind.speed + ' m/s'

					});
				} catch (error) {
					console.error('[Test]', 'Error fetching weather data:', error.message);
					if (error.response) {
						this.setError('Error:' + error.response.status + '<br>' + error.response.data.message);
					} else {
						this.setError('Error:' + error.message);
					}
				}
			}

			// 5-day forecast API function
			async forecast() {
				console.log('Running the test');
				try {
					const apiKey = '8fd67a091981a015cfbb030cfecdccd0';
					const city = document.querySelector('input[name="cityState"]').value + ', USA';

					// const lat = latitude;
					// const lon = longitude;

					// call forecast API
					const forecastResponse = await axios.get(
						'https://api.openweathermap.org/data/2.5/forecast',
						{
							params: {
								q: city,
								// lat: lat,
								// lon: lon,
								appid: apiKey,
								units: 'imperial'
							}
						}
					);
					const forecastResponseData = forecastResponse.data;
					console.log('forecastResponseData');
					console.log(forecastResponseData);
					console.log(forecastResponseData.city.name);

					// Populate Forecast Table
					// Helper function to format date nicely
					const formatDate = (dateString) => {
						const options = {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'};
						return new Date(dateString).toLocaleDateString('en-US', options);
					};

					// Map OWM weather condition codes to emojis
					const getIcon = (id) => {
						if (id >= 200 && id < 300) return '⛈️';
						if (id >= 300 && id < 400) return '🌦️';
						if (id >= 500 && id < 600) return '🌧️';
						if (id >= 600 && id < 700) return '❄️';
						if (id >= 700 && id < 800) return '🌫️';
						if (id === 800) return '☀️';
						if (id > 800) return '⛅';
						return '🌡️';
					};

					const tbody = document.getElementById('forecast-body');
					tbody.innerHTML = ''; // clear previous results

					forecastResponseData.list.forEach(item => {
						const row = document.createElement('tr');

						// Extract data
						const timeStr = formatDate(item.dt_txt);
						const temp = Math.round(item.main.temp);
						const feelsLike = Math.round(item.main.feels_like);
						const weatherDesc = item.weather[0].description;
						const weatherIcon = getIcon(item.weather[0].id);

						row.innerHTML = `
							<td class="col-time">${timeStr}</td>
							<td class="col-temp">${temp}°F</td>
							<td class="col-feels">${feelsLike}°F</td>
							<td class="col-weather">
								<span class="weather-icon">${weatherIcon}</span>
								<small>${weatherDesc}</small>
							</td>
						`;
						tbody.appendChild(row);
					});

				} catch (error) {
					console.error('[Test]', 'Error fetching forecast data:', error.message);
					if (error.response) {
						this.setError('Error:' + error.response.status + '<br>' + error.response.data.message);
					} else {
						this.setError('Error:' + error.message);
					}
				}
			}

			// dump error messages to body so people can debug themselves
			setError(message) {
				const errorResults = document.getElementsByClassName("error-results")[0]
				document.getElementById('error').innerHTML = message;
				if (document.getElementById('error').innerText != '') {
					errorResults.style.display = 'block';
				} else {
					errorResults.style.display = 'none';
				}
			}

			setResults(results) {
				document.getElementById('city').innerHTML = results.city;
				document.getElementById('temp').innerHTML = results.temp;
				document.getElementById('current').innerHTML = results.description;
				document.getElementById('humid').innerHTML = results.humidity;
				//	document.getElementById('rain').innerHTML = results.rain;
				document.getElementById('wind').innerHTML = results.windSpeed;
			}
		}

	</script>

	<style>

			width: 400px;
			margin: 0 auto;
			padding: 20px;
			text-align: left;
			border: 1px solid black;
		}
		.header-text{text-align: center}
		.test-results {

			margin: 0 auto;
			padding: 20px;

		}

		.title {
			display: contents;
		}

		.l2 {
			display: contents;
		}

		.city-state-container {
			max-width: 250px;
			margin: 0 auto;
			padding: 20px;
			text-align: center;
		}

		.error-results {
			max-width: 250px;
			margin: 0 auto;
			padding: 20px;
			text-align: center;
			background-color: lightcoral;
		}

		.button-container {
			text-align: center;
		}

		.button-container > button {
			margin: 0;
			padding: 10px 18px;
			color: white;
			background-color: #008000;
			border: none;
			border-radius: 3px;
			transition: all 200ms ease-in-out;
			font-size: 14px;
		}

		.button-container > button:hover {
			background-color: #00A000;
		}

		.button-container > button:active {
			background-color: #006000;
		}
		.emoji-house:before{
			content:'🏡'
		}
		.emoji-temp:before{
			content:'🌡️'
		}
		.emoji-cloud:before{
			content:'⛅'
		}
		.emoji-humidity:before{
			content:'💧'
		}
		.emoji-wind:before{
			content:'💨'
		}
		.col-time{width: 32%;}
		.col-temp{width: 20%;
			text-align: center;}
		.col-feels{width: 20%;
		text-align: center;}
		.col-weather{width: 28%;
		text-align: center;}
	</style>
	<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
<div class="container">
	<div class="header-text">
		<h1>low-bandwidth weather</h1>
	</div>
	<div class="error-results" style="display:none;">
		<div class="error-message" id="error"></div>
	</div>
	<div class="test-results" id="result">
		<div class="l1">
			<span class="emoji-house"></span>
			<div class="title">City:</div>
			<div class="l2" id="city"></div>
		</div>
		<div class="l1">
			<span class="emoji-temp"></span>
			<div class="title">Temp:</div>
			<div class="l2" id="temp"></div>
		</div>
		<div class="l1">
			<span class="emoji-cloud"></span>
			<div class="title">Currently:</div>
			<div class="l2" id="current"></div>
		</div>
		<div class="l1">
			<span class="emoji-humidity"></span>
			<div class="title">Humidity:</div>
			<div class="l2" id="humid"></div>
		</div>
		<div class="l1">
			<span class="emoji-wind"></span>
			<div class="title">Wind:</div>
			<div class="l2" id="wind"></div>
		</div>
	</div>
	<div class="city-state-container">
		<form>
			<label for="cityState">City, St:</label>
			<br>
			<input type="text" id="cityState" name="cityState" placeholder="City, St"/>
		</form>
	</div>
	<div class="button-container"></div>

	<div class="forecast-section">
		<h2>Hourly Forecast</h2>
		<table id="forecast-table">
			<thead>
			<tr>
				<th class="col-time">Time</th>
				<th class="col-temp">Temp (°C)</th>
				<th class="col-feels">Feels Like</th>
				<th class="col-weather">Weather Condition</th>
			</tr>
			</thead>
			<tbody id="forecast-body">
			<!-- forcast API response goes here -->
			</tbody>
		</table>
	</div>
</div>
<script>
	'use strict';
	function addButtonForTest(context, Test) {
		let testButton = document.createElement('button');

		// add keydown even listener to trigger search on Enter
		const cityState = document.getElementById('cityState');
		cityState.addEventListener('keydown', function (event) {
			if (event.key === 'Enter') {
				event.preventDefault();
				Test.run();
				Test.forecast();
			}
		});
		testButton.type = 'button';
		testButton.innerText = 'Get Your Weather';
		testButton.onclick = () => { Test.run(); Test.forecast(); };

		context.appendChild(testButton);

		return testButton;
	}

	const test = new Test();
	const buttonContainer = document.getElementsByClassName('button-container')[0];

	addButtonForTest(buttonContainer, test);

	/**
	 * Startng with opening up the openmaps API docs, atempted to use the OneCall 3.0 api. Response from the server made it clear the supplid api key was not valid for the OneCall api.
	 *
	 * Switching to the 2.5 API, I got a helpful "Invalid API key. Please see https://openweathermap.org/faq#error401 for more info." message.
	 *
	 * I pulled up my records and found I had an OpenWeatherMap account from Pebble development years ago. I spun up a new API key and waited a few hours for it to activate, and started planning the layout of the page.
	 *
	 * Back in 2024 western North Carolina got hit by Hurricane Helene. Being very far inland and, well, mountains, the area was not prepared for the catastrophic flooding that happened. In the aftermath of entire communities being washed away the infrastructure for modern life was knocked out of commission for, in some places, months.
	 *
	 * That included cell phone towers. The remaining towers were quickly overwhelmed. Local news sites began publishing bare-bones websites, stripped down to the bare essential HTML, CSS and JS.
	 *
	 * Last winter's ice storm here in Nashville caused a similar problem in some parts of the city, at a much smaller scale. Would having an easy way to check the weather during a major weather event have been beneficial to folks?
	 *
	 * **The goal, then, is to make an informational weather web app as light and fast as possible.**
	 *
	 * Once the new openweather api key started working I quickly pulled in the default data and pulled out the basic info needed for a weather report. Adding in a simple city, state field allows people to search their location.
	 *
	 * The plaintext response looked very ugly, so I decided to pull in an icon font. I used to use fontAwesome for this, but pulling it up for this project I found it was a very big package that required several more steps than I was planning.
	 *
	 * I went with material symbols and, as I was running out of time, pulled in the whole font library. There's a good deal of updates I want to do to this web app but am timeboxed to get the POC working.
	 *
	 *
	 * Future iteration roadmap:
	 * ✅ -> add in five day forecast API data
	 *  ------> v0.3
	 * -> Accessibility check
	 * ✅ -> Trim font library to only needed icons
	 * 	------> v0.2, replaced with emojis instead, removed font library
	 *
	 * ✅ -> Add appropriate icons for current weather responses
	 * 	------> v0.4
	 * 	-> Mobile view fix
	 * 	------> v0.5?
	 * -> set up browser location API call
	 * -> openweathermap returns Murray, UT for Murray, KY. I will need to run the city request through the geolocation api to get the correct locations.
	 * ----> Or switch to other weather api options?
	 * -> change from Axios to Fetch()?
	 */

</script>
